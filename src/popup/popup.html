<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>GitHub Pixel Diff</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <!-- Окно — про действие, а не про рассказ о расширении: состояние
         доступа, кнопка и ссылки. Объяснения, что это вообще такое, и всё
         редкое — на странице настроек. -->
    <h1>GitHub Pixel Diff</h1>

    <p id="status" class="status status-checking" data-i18n="popupChecking"></p>

    <button id="grant" type="button" hidden data-i18n="popupGrant"></button>

    <p class="report">
      <span id="version"></span> ·
      <a id="settings" href="#" data-i18n="popupSettings"></a> ·
      <a href="https://nemo-illusionist.github.io/gh-pixel-diff/"
         target="_blank" rel="noreferrer" data-i18n="popupSiteShort"></a> ·
      <a id="report" href="https://github.com/Nemo-Illusionist/gh-pixel-diff/issues/new"
         target="_blank" rel="noreferrer" data-i18n="popupReport"></a>
    </p>

    <script src="../shared/page.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
