<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>GitHub Pixel Diff</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <h1>GitHub Pixel Diff</h1>
    <p class="lead" data-i18n-rich="popupLead"></p>

    <section>
      <h2 data-i18n="optionsAccess"></h2>
      <p id="status" class="status status-checking" data-i18n="popupChecking"></p>
      <button id="grant" type="button" hidden data-i18n="popupGrant"></button>
      <p class="note" data-i18n-rich="popupNote"></p>
    </section>

    <section>
      <h2 data-i18n="optionsPanel"></h2>
      <label class="setting">
        <input id="show-views" type="checkbox" checked>
        <span data-i18n="popupShowViews"></span>
      </label>
      <p class="note" data-i18n="optionsShowViewsHint"></p>
    </section>

    <!-- Свои серверы GitLab. Их адреса в манифесте не назовёшь, поэтому
         разрешение и регистрация скрипта случаются здесь, по нажатию. -->
    <section id="instances">
      <h2 data-i18n="optionsGitlab"></h2>
      <p class="note" data-i18n-rich="optionsGitlabLead"></p>

      <form id="add">
        <input id="host" type="text" spellcheck="false" autocomplete="off"
               data-i18n-placeholder="optionsHostHint">
        <button type="submit" data-i18n="optionsAdd"></button>
      </form>

      <p id="message" class="message" hidden></p>

      <ul id="hosts" class="hosts"></ul>
      <p id="empty" class="note" data-i18n="optionsEmpty"></p>
    </section>

    <script src="../shared/page.js"></script>
    <script src="options.js"></script>
  </body>
</html>
