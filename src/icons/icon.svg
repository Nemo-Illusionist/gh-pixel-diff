<!-- Исходник значка: из него скрипт собирает все размеры (npm run icons).
     Сетка кратна восьми: при 128 → 16 края кадров и пиксели попадают на целые
     пиксели, и в мелком размере значок не размазывается.
     Красный — тот же #d1242f, которым расширение обводит найденное. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Задний кадр — «до». Его правый нижний угол закрыт передним. -->
  <rect x="8" y="8" width="76" height="76" rx="13" fill="#1f2328"/>
  <!-- Передний — «после». Обводка идёт по краю, поэтому кадр виден как
       40…120, а белое поле внутри — как 48…112, с центром в 80. -->
  <rect x="44" y="44" width="72" height="72" rx="13" fill="#ffffff" stroke="#1f2328" stroke-width="8"/>
  <!-- Найденные пиксели: 56…104, центр 80 — ровно посередине белого поля,
       по восемь единиц отступа с каждой стороны. -->
  <g fill="#d1242f">
    <rect x="56" y="56" width="16" height="16"/>
    <rect x="72" y="72" width="16" height="16"/>
    <rect x="88" y="88" width="16" height="16"/>
  </g>
</svg>
