# Проверка на живой странице GitHub.
#
# Разметку панели просмотра GitHub меняет без предупреждений: этот прогон —
# способ узнать об этом раньше пользователей. Раз в неделю и по кнопке.
name: Живая проверка

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Пул-реквест-полигон
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build.mjs
      - run: npx playwright test tests/live.spec.js
