# Проверка на живых страницах GitHub и GitLab.
#
# Разметку просмотрщика там меняют без предупреждений: этот прогон — способ
# узнать об этом раньше пользователей. Раз в неделю и по кнопке.
name: Живая проверка

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Живые страницы
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build.mjs
      - run: npx playwright test tests/live.spec.js
