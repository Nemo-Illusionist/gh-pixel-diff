# Проверки на каждый push и пул-реквест.
#
# Тесты идут в том же образе Playwright, что и локальный `npm test`, поэтому
# результат в CI и на машине совпадает.
name: Проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build.mjs
      - run: node scripts/build-site.mjs
      # Живой тест ходит на github.com и вынесен в отдельный запуск: он ломается
      # от чужих изменений, а не от наших, и не должен блокировать пул-реквест.
      - run: >
          npx playwright test
          tests/parse.spec.js tests/frame.spec.js
          tests/locales.spec.js tests/popup.spec.js tests/site.spec.js

  lint:
    name: Проверка манифеста Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build.mjs
      # Без --self-hosted: дополнение подаётся на витрину, и проверять его
      # надо по тем же правилам, по которым его примет addons.mozilla.org.
      - run: npx --yes web-ext@8 lint --source-dir dist/firefox
