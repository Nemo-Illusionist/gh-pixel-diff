# Релиз по тегу: собирает архивы и выкладывает их на страницу релизов.
#
# Версия берётся из манифеста и сверяется с тегом — иначе в релизе окажется
# архив с версией, которой никто не ждал.
name: Релиз

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Сверить версию с тегом
        run: |
          manifest="$(node -p "require('./src/manifest.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией манифеста $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_ENV"

      - name: Собрать архивы
        run: scripts/package.sh

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Что изменилось — из CHANGELOG, раздел ровно этой версии.
          node - <<'JS' > notes.md
          const { readFileSync } = require('node:fs');
          const version = process.env.version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find((part) => part.startsWith(`[${version}]`));
          if (section) {
            console.log(section.replace(/^\[.*?\].*$/m, "## What's changed").trimEnd());
            console.log();
          }
          JS
          cat >> notes.md <<'NOTES'
          ## Installation

          **Chrome, Edge, any Chromium** — download `gh-pixel-diff-chrome-*.zip`,
          unpack it, open `chrome://extensions`, turn on "Developer mode" and
          press "Load unpacked" → the unpacked folder.

          **Firefox** — download `gh-pixel-diff-firefox-*.zip`, open
          `about:debugging#/runtime/this-firefox` → "Load Temporary Add-on" →
          pick the archive. It lives until the browser restarts: a permanent
          install requires signing on addons.mozilla.org.

          **Safari, macOS and iOS** — download `gh-pixel-diff-safari-*.zip`,
          unpack it and follow `SAFARI-INSTALL.txt` inside. Xcode and your own
          certificate are required: without a signature macOS won't register the
          extension.

          After installing, open the extension popup and grant access to
          `viewscreen.githubusercontent.com` — that is the domain GitHub serves
          image previews from.

          SHA-256 sums for every archive are in `checksums.txt`.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/release/*.zip dist/release/checksums.txt

  # Магазины подхватывают тот же тег: сначала архивы на странице релизов —
  # они нужны и тем, кто ставит расширение руками, — потом витрины.
  stores:
    name: Магазины
    needs: release
    uses: ./.github/workflows/publish.yml
    secrets: inherit
