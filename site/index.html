<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pixel Diff — compare two images</title>
<meta name="description" content="Drop two images and see what changed between them, pixel by pixel. Everything happens in your browser.">
<link rel="icon" href="icon.svg">
<!-- panel.css общий с расширением, style.css — только про эту страницу. -->
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="head">
  <img class="head-mark" src="icon.svg" alt="" width="44" height="44">
  <div>
    <h1 data-i18n="siteTitle"></h1>
    <p class="head-note" data-i18n="siteTagline"></p>
  </div>
  <a class="head-link" href="https://github.com/Nemo-Illusionist/gh-pixel-diff" data-i18n="siteRepository"></a>
</header>

<main>
  <!-- Две половины: «было» и «стало». Пока обе не заполнены, сравнивать нечего.
       Кнопка очистки вынесена из label: внутри неё любое нажатие открывало бы
       выбор файла, в том числе нажатие на саму кнопку. -->
  <section class="drops" id="drops">
    <div class="drop" data-slot="before">
      <label class="drop-body">
        <input type="file" accept="image/*" hidden>
        <span class="drop-label" data-i18n="siteSlotBefore"></span>
        <span class="drop-hint" data-i18n="siteDropHint"></span>
        <img class="drop-preview" alt="" hidden>
        <span class="drop-file"></span>
      </label>
      <button class="drop-clear" type="button" data-i18n="siteClear" hidden></button>
    </div>
    <div class="drop" data-slot="after">
      <label class="drop-body">
        <input type="file" accept="image/*" hidden>
        <span class="drop-label" data-i18n="siteSlotAfter"></span>
        <span class="drop-hint" data-i18n="siteDropHint"></span>
        <img class="drop-preview" alt="" hidden>
        <span class="drop-file"></span>
      </label>
      <button class="drop-clear" type="button" data-i18n="siteClear" hidden></button>
    </div>
  </section>

  <p class="paste" data-i18n="sitePasteHint"></p>

  <!-- Панель сравнения: та же, что во фрейме GitHub. -->
  <section class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2 data-i18n="siteResult"></h2>
      <button class="panel-reset" id="reset" type="button" data-i18n="siteClearAll"></button>
    </div>
    <!-- Сцена под кадр: её высота не ездит вслед за размером кадра. -->
    <div class="panel-frame ghpd-stage">
      <!-- Имя версии — над кадром, как в 2-up у самого GitHub. -->
      <div class="ghpd-plate" id="plate">
        <span class="ghpd-plate-label" id="plate-name"></span>
        <canvas class="ghpd-canvas" id="canvas"></canvas>
      </div>
      <div class="ghpd-triple" id="triple" hidden></div>
    </div>
    <p class="ghpd-meta" id="meta"></p>
    <!-- Пиксель под курсором: координаты и оба цвета. -->
    <p class="ghpd-probe" id="probe"></p>
    <!-- Строка управления: какой кадр показать и куда в нём смотреть. Порог,
         рамка и сохранение уехали под «⋯» — их собирает скрипт. -->
    <div class="ghpd-bar" id="bar">
      <div class="ghpd-views" id="views"></div>
    </div>
    <div class="ghpd-controls" id="controls" hidden>
      <span class="ghpd-mark ghpd-mark-small"></span>
      <input class="ghpd-slider" id="threshold" type="range" min="0" max="0.5" step="0.01" value="0.1">
      <span class="ghpd-mark ghpd-mark-large"></span>
    </div>
  </section>

  <!-- Настройка сравнения: всё то же, что на странице настроек расширения.
       Свёрнута: на первом экране важнее две половины, а не наладка. Хранится
       в localStorage этой страницы — хранилища расширения здесь нет. -->
  <details class="tune" id="tune">
    <summary data-i18n="siteTune"></summary>

    <h3 data-i18n="optionsLanguage"></h3>
    <label class="setting">
      <!-- Список наполняется из самих локалей: переписанный руками разойдётся
           с ними на первой же новой. -->
      <select id="language"></select>
    </label>
    <p class="note" data-i18n="siteLanguageHint"></p>

    <h3 data-i18n="optionsPanel"></h3>
    <label class="setting">
      <input id="show-views" type="checkbox" checked>
      <span data-i18n="popupShowViews"></span>
    </label>
    <p class="note" data-i18n="optionsShowViewsHint"></p>

    <h3 data-i18n="optionsColors"></h3>
    <div class="tune-row">
      <label class="setting">
        <input id="color-changed" type="color" value="#d1242f">
        <span data-i18n="optionsColorMain"></span>
      </label>
      <button class="tune-reset" id="colors-reset" type="button" data-i18n="optionsColorsReset"></button>
    </div>
    <p class="note" data-i18n="siteColorsHint"></p>

    <!-- Второй цвет появляется только вместе с направлением: без него он
         ничего не значит и только путает. -->
    <label class="setting">
      <input id="direction" type="checkbox">
      <span data-i18n="optionsDirection"></span>
    </label>
    <div class="tune-row" id="direction-colors" hidden>
      <label class="setting">
        <input id="color-lighter" type="color" value="#0969da">
        <span data-i18n="optionsColorLighter"></span>
      </label>
    </div>
    <p class="note" data-i18n="optionsDirectionHint"></p>

    <h3 data-i18n="optionsBeta"></h3>
    <label class="setting">
      <input id="beta" type="checkbox">
      <span data-i18n="optionsBetaOn"></span>
    </label>
    <p class="note" data-i18n="optionsBetaHint"></p>
  </details>

  <p class="failure" id="failure" hidden></p>
</main>

<footer class="foot">
  <p><span data-i18n="sitePrivacy"></span>
    <a href="privacy.html" data-i18n="sitePrivacyLink"></a></p>
  <p><span data-i18n="siteExtensionPitch"></span>
    <a href="https://chromewebstore.google.com/detail/kddgddagklbfhikmlbailnempmndcngi" data-i18n="siteExtensionLink"></a></p>
</footer>

<script src="messages.js"></script>
<script src="shim.js"></script>
<script src="i18n.js"></script>
<script src="pixelmatch.js"></script>
<script src="compare.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
